<!doctype html><html lang="ja" data-format="ichigo-archive-1"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>幻覚をめぐる経済学</title><meta name="thread_key" content="economy/0953"><style>body{font-family:sans-serif;max-width:52em;margin:auto;padding:1em}dd{margin:0 0 1.2em 1.5em;line-height:1.6}dt{color:#060}a.anc{color:#36c}#pop{display:none;position:absolute;z-index:9;max-width:40em;max-height:60vh;overflow:auto;background:#fffbe8;border:1px solid #cb9;box-shadow:0 2px 8px #0003;padding:.2em .8em;font-size:.95em}#pop dd{margin-bottom:.6em}.miss{color:#999}</style><nav><a href="index.html">トップ</a> ＞ <a href="year_2004.html">2004年</a></nav><h1>幻覚をめぐる経済学</h1><p>economy/0953 ／ 1 レス ／ 2004/09/03〜2004/09/03</p><dl><dt id="1" data-date="2004/09/03(Fri) 09:47">1 ：<b>ゴン太郎</b>：2004/09/03(Fri) 09:47  </dt><dd>経済学の主流は利己心の経済学である。<br>この確立した自己に基づく経済学にあえて反論する。<br><br>参考文献<br>バロウズ/山形訳『ノヴァ急行』<br>萩原朔太郎『猫町』『虚妄の正義』<br>ヴィンスヴァンガー『金と魔術』<br>Jon Elster, Ulysees　Unbound<br>Stephen Holmes, The Secret History of self-Interest<br>など</dd></dl><script>
(function(){
  var pop=document.createElement('div');pop.id='pop';document.body.appendChild(pop);
  function show(a){
    var h='';a.dataset.to.split(' ').forEach(function(n){
      var dt=document.getElementById(n);
      h+= dt ? '<dl>'+dt.outerHTML.replace(/ id="\d+"/,'')+dt.nextElementSibling.outerHTML+'</dl>'
             : '<p class="miss">&gt;&gt;'+n+' は未取得</p>';});
    pop.innerHTML=h;pop.style.display='block';
    var r=a.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+scrollX+'px';
    pop.style.top=(r.bottom+6+scrollY)+'px';
  }
  document.addEventListener('mouseover',function(ev){
    var a=ev.target.closest('a.anc');if(a)show(a);
    else if(!ev.target.closest('#pop'))pop.style.display='none';});
  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a.anc');
    if(a&&matchMedia('(hover:none)').matches&&pop.style.display!=='block'){ev.preventDefault();show(a);}
    else if(!ev.target.closest('#pop')&&!a)pop.style.display='none';});
})();
</script>
