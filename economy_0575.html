<!doctype html><html lang="ja" data-format="ichigo-archive-1"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>本当の都市再生計画とは</title><meta name="thread_key" content="economy/0575"><style>body{font-family:sans-serif;max-width:52em;margin:auto;padding:1em}dd{margin:0 0 1.2em 1.5em;line-height:1.6}dt{color:#060}a.anc{color:#36c}#pop{display:none;position:absolute;z-index:9;max-width:40em;max-height:60vh;overflow:auto;background:#fffbe8;border:1px solid #cb9;box-shadow:0 2px 8px #0003;padding:.2em .8em;font-size:.95em}#pop dd{margin-bottom:.6em}.miss{color:#999}</style><nav><a href="index.html">トップ</a> ＞ <a href="year_2002.html">2002年</a></nav><h1>本当の都市再生計画とは</h1><p>economy/0575 ／ 1 レス ／ 2002/07/26〜2002/07/26</p><dl><dt id="1" data-date="2002/07/26(Fri) 21:45">1 ：<b>日経図書賞を狙え</b>：2002/07/26(Fri) 21:45  </dt><dd>ドラえもんによると<br>練馬区の野比家一帯は、２１世紀になると高層アパートになっている。<br>これは住民が私有財産を東京都に献上し、東京都が都市計画を策定した<br>結果ではなかろうか？<br>本当の都市再生とは住宅地一帯にメスを入れるものだと思うが、<br>みなさんはどのように思うのかぜひ意見を聞きたい。</dd></dl><script>
(function(){
  var pop=document.createElement('div');pop.id='pop';document.body.appendChild(pop);
  function show(a){
    var h='';a.dataset.to.split(' ').forEach(function(n){
      var dt=document.getElementById(n);
      h+= dt ? '<dl>'+dt.outerHTML.replace(/ id="\d+"/,'')+dt.nextElementSibling.outerHTML+'</dl>'
             : '<p class="miss">&gt;&gt;'+n+' は未取得</p>';});
    pop.innerHTML=h;pop.style.display='block';
    var r=a.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+scrollX+'px';
    pop.style.top=(r.bottom+6+scrollY)+'px';
  }
  document.addEventListener('mouseover',function(ev){
    var a=ev.target.closest('a.anc');if(a)show(a);
    else if(!ev.target.closest('#pop'))pop.style.display='none';});
  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a.anc');
    if(a&&matchMedia('(hover:none)').matches&&pop.style.display!=='block'){ev.preventDefault();show(a);}
    else if(!ev.target.closest('#pop')&&!a)pop.style.display='none';});
})();
</script>
