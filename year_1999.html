<!doctype html><html lang="ja" data-format="ichigo-archive-1"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>1999年に立ったスレ - いちごBBS経済板 アーカイブ</title><style>body{font-family:sans-serif;max-width:52em;margin:auto;padding:1em;line-height:1.5}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:.15em .5em}td.n{text-align:right}nav{margin:.5em 0}</style><nav><a href="index.html">トップ</a> ｜  <a href="year_2000.html">2000年 ▶</a></nav><h1>1999年に立ったスレ</h1><p>1 スレ / 6 レス</p><p>スレタイで絞り込み: <input id="q" type="search" size="30" placeholder="例: 日銀 緩和（空白で区切ると両方を含むもの）"> <span id="qc"></span></p><table id="tl"><tr><th>番号</th><th>スレタイ</th><th>レス</th><th>期間</th></tr><tr class="t" data-title="テスト"><td class="n">0001</td><td><a href="economy_0001.html">テスト</a></td><td class="n">6</td><td>1999/12/08〜2001/09/23</td></tr></table><nav> <a href="year_2000.html">2000年 ▶</a></nav><script>
function setupFilter(inp, tbl, cnt, hideWhenEmpty) {
  var rows = [].slice.call(document.querySelectorAll('#' + tbl + ' tr.t'));
  var norm = function (s) { return (s.normalize ? s.normalize('NFKC') : s).toLowerCase(); };
  rows.forEach(function (r) { r._t = norm(r.getAttribute('data-title')); });
  var i = document.getElementById(inp), c = document.getElementById(cnt), tb = document.getElementById(tbl);
  function run() {
    var ws = norm(i.value).split(/\s+/).filter(Boolean), n = 0;
    rows.forEach(function (r) {
      var ok = ws.every(function (w) { return r._t.indexOf(w) >= 0; });
      r.style.display = ok ? '' : 'none'; if (ok) n++;
    });
    if (hideWhenEmpty) tb.style.display = ws.length ? '' : 'none';
    c.textContent = ws.length ? rows.length + '本中 ' + n + '本' : (hideWhenEmpty ? '' : rows.length + '本');
  }
  i.addEventListener('input', run);
  var m = location.search.match(/[?&]q=([^&]*)/);
  if (m) i.value = decodeURIComponent(m[1].replace(/\+/g, ' '));
  run();
}
</script><script>setupFilter('q','tl','qc',false);</script>
