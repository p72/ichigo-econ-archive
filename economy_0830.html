<!doctype html><html lang="ja" data-format="ichigo-archive-1"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>（野中）を読み解くスレ</title><meta name="thread_key" content="economy/0830"><style>body{font-family:sans-serif;max-width:52em;margin:auto;padding:1em}dd{margin:0 0 1.2em 1.5em;line-height:1.6}dt{color:#060}a.anc{color:#36c}#pop{display:none;position:absolute;z-index:9;max-width:40em;max-height:60vh;overflow:auto;background:#fffbe8;border:1px solid #cb9;box-shadow:0 2px 8px #0003;padding:.2em .8em;font-size:.95em}#pop dd{margin-bottom:.6em}.miss{color:#999}</style><nav><a href="index.html">トップ</a> ＞ <a href="year_2003.html">2003年</a></nav><h1>（野中）を読み解くスレ</h1><p>economy/0830 ／ 3 レス ／ 2003/10/03〜2003/10/21</p><dl><dt id="1" data-date="2003/10/03(Fri) 01:20">1 ：<b>学部２年</b>：2003/10/03(Fri) 01:20  </dt><dd>この板になじんでいきたいと思います<br><br>知識国家論序説をもっているかタガイたら<br>読み合わせましょう<br><br>僕も定期的に書き込んでいきます</dd><dt id="2" data-date="2003/10/03(Fri) 11:01">2 ：<b>ホークス優勝名無しさん</b>：2003/10/03(Fri) 11:01  </dt><dd>あんまいい加減なスレの立て方してると誰にも相手にされないよsage</dd><dt id="3" data-date="2003/10/21(Tue) 16:26">3 ：<b>鷹虎名無しさん</b>：2003/10/21(Tue) 16:26  </dt><dd>野中ともよ？　sage</dd></dl><script>
(function(){
  var pop=document.createElement('div');pop.id='pop';document.body.appendChild(pop);
  function show(a){
    var h='';a.dataset.to.split(' ').forEach(function(n){
      var dt=document.getElementById(n);
      h+= dt ? '<dl>'+dt.outerHTML.replace(/ id="\d+"/,'')+dt.nextElementSibling.outerHTML+'</dl>'
             : '<p class="miss">&gt;&gt;'+n+' は未取得</p>';});
    pop.innerHTML=h;pop.style.display='block';
    var r=a.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+scrollX+'px';
    pop.style.top=(r.bottom+6+scrollY)+'px';
  }
  document.addEventListener('mouseover',function(ev){
    var a=ev.target.closest('a.anc');if(a)show(a);
    else if(!ev.target.closest('#pop'))pop.style.display='none';});
  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a.anc');
    if(a&&matchMedia('(hover:none)').matches&&pop.style.display!=='block'){ev.preventDefault();show(a);}
    else if(!ev.target.closest('#pop')&&!a)pop.style.display='none';});
})();
</script>
