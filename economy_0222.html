<!doctype html><html lang="ja" data-format="ichigo-archive-1"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>スタイルの美しい論文を紹介するスレッド</title><meta name="thread_key" content="economy/0222"><style>body{font-family:sans-serif;max-width:52em;margin:auto;padding:1em}dd{margin:0 0 1.2em 1.5em;line-height:1.6}dt{color:#060}a.anc{color:#36c}#pop{display:none;position:absolute;z-index:9;max-width:40em;max-height:60vh;overflow:auto;background:#fffbe8;border:1px solid #cb9;box-shadow:0 2px 8px #0003;padding:.2em .8em;font-size:.95em}#pop dd{margin-bottom:.6em}.miss{color:#999}</style><nav><a href="index.html">トップ</a> ＞ <a href="year_2001.html">2001年</a></nav><h1>スタイルの美しい論文を紹介するスレッド</h1><p>economy/0222 ／ 1 レス ／ 2001/03/20〜2001/03/20</p><dl><dt id="1" data-date="2001/03/20(Tue) 19:53">1 ：<b>名無しさんのマーチ</b>：2001/03/20(Tue) 19:53  </dt><dd>自分で論文を書く時に、<br>論理構成、平易な英語、記号、その他、などなどの面で、<br>お手本になるような論文を紹介しあいませんか？<br>内容じゃなく、<br>スタイルがすばらしい論文を紹介するスレッドなんですがどうでしょ。<br>私は、論文じゃないですが、<br>Gerard Debreu<br>Theory of Value<br>をあげておきます。</dd></dl><script>
(function(){
  var pop=document.createElement('div');pop.id='pop';document.body.appendChild(pop);
  function show(a){
    var h='';a.dataset.to.split(' ').forEach(function(n){
      var dt=document.getElementById(n);
      h+= dt ? '<dl>'+dt.outerHTML.replace(/ id="\d+"/,'')+dt.nextElementSibling.outerHTML+'</dl>'
             : '<p class="miss">&gt;&gt;'+n+' は未取得</p>';});
    pop.innerHTML=h;pop.style.display='block';
    var r=a.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+scrollX+'px';
    pop.style.top=(r.bottom+6+scrollY)+'px';
  }
  document.addEventListener('mouseover',function(ev){
    var a=ev.target.closest('a.anc');if(a)show(a);
    else if(!ev.target.closest('#pop'))pop.style.display='none';});
  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a.anc');
    if(a&&matchMedia('(hover:none)').matches&&pop.style.display!=='block'){ev.preventDefault();show(a);}
    else if(!ev.target.closest('#pop')&&!a)pop.style.display='none';});
})();
</script>
