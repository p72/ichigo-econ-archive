<!doctype html><html lang="ja" data-format="ichigo-archive-1"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ココに書き込みしてる人は</title><meta name="thread_key" content="economy/0533"><style>body{font-family:sans-serif;max-width:52em;margin:auto;padding:1em}dd{margin:0 0 1.2em 1.5em;line-height:1.6}dt{color:#060}a.anc{color:#36c}#pop{display:none;position:absolute;z-index:9;max-width:40em;max-height:60vh;overflow:auto;background:#fffbe8;border:1px solid #cb9;box-shadow:0 2px 8px #0003;padding:.2em .8em;font-size:.95em}#pop dd{margin-bottom:.6em}.miss{color:#999}</style><nav><a href="index.html">トップ</a> ＞ <a href="year_2002.html">2002年</a></nav><h1>ココに書き込みしてる人は</h1><p>economy/0533 ／ 3 レス ／ 2002/06/04〜2002/07/28</p><dl><dt id="1" data-date="2002/06/04(Tue) 09:24">1 ：<b>並盛梅雨だく名無しさん</b>：2002/06/04(Tue) 09:24  </dt><dd>皆株とかやってるの？</dd><dt id="2" data-date="2002/07/28(Sun) 10:43">2 ：<b>夏の名無しさん</b>：2002/07/28(Sun) 10:43  </dt><dd>てすと</dd><dt id="3" data-date="2002/07/28(Sun) 10:46">3 ：<b>夏の名無しさん</b>：2002/07/28(Sun) 10:46  </dt><dd>テスト</dd></dl><script>
(function(){
  var pop=document.createElement('div');pop.id='pop';document.body.appendChild(pop);
  function show(a){
    var h='';a.dataset.to.split(' ').forEach(function(n){
      var dt=document.getElementById(n);
      h+= dt ? '<dl>'+dt.outerHTML.replace(/ id="\d+"/,'')+dt.nextElementSibling.outerHTML+'</dl>'
             : '<p class="miss">&gt;&gt;'+n+' は未取得</p>';});
    pop.innerHTML=h;pop.style.display='block';
    var r=a.getBoundingClientRect();
    pop.style.left=Math.max(8,Math.min(r.left,innerWidth-pop.offsetWidth-8))+scrollX+'px';
    pop.style.top=(r.bottom+6+scrollY)+'px';
  }
  document.addEventListener('mouseover',function(ev){
    var a=ev.target.closest('a.anc');if(a)show(a);
    else if(!ev.target.closest('#pop'))pop.style.display='none';});
  document.addEventListener('click',function(ev){
    var a=ev.target.closest('a.anc');
    if(a&&matchMedia('(hover:none)').matches&&pop.style.display!=='block'){ev.preventDefault();show(a);}
    else if(!ev.target.closest('#pop')&&!a)pop.style.display='none';});
})();
</script>
